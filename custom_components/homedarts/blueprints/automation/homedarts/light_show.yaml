blueprint:
  name: "HomeDarts: light show"
  description: >-
    Plays your light effects at the big moments of the game: the start of a
    game, a 180, a high finish, a bust, a won leg or match, a personal best,
    the daily goal, a won bull-off, an achievement and the winner of a
    tournament, and optionally while you pull the darts. Every moment has
    its own actions, for example a WLED preset or a flash of your room
    lights; a moment without actions stays dark.


    The darts of the practice game's bot are not in the board, so its moments
    stay dark unless you turn on "Also for the bot". With "Also react to online
    matches", busts, won legs and won matches of online matches on
    play.autodarts.io play their effects, too. They need the online bridge of
    the integration and the browser extension Tools for Autodarts.


    Optionally the lights return to how they were after an effect, and the
    detection pauses while an effect plays, so flashing lights next to the
    board cannot disturb the cameras. Choose the moments whose actions start
    an effect under "After the effect". Moments that happen while an effect
    plays wait for it, up to nine of them.


    Your actions can use `moment` (`game_start`, `maximum`, `high_finish`,
    `bust`, `leg`, `match`, `personal_best`, `daily_goal`, `bull_off`,
    `achievement`, `tournament`, `takeout` or `board_clear`), `who` (the
    player's name, "Bot" for the bot, or "Player 2"; empty at the start of a
    game), `player`
    (1 to 4), `score` (of a 180), `checkout` (of a won leg) and
    `trigger.to_state.attributes` (every detail of the board event).


    [Settings and examples in the guide](https://dennis-otto.github.io/homedarts-for-autodarts/automations.html#light-show)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/blueprints/automation/homedarts/light_show.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board:
      name: Board
      icon: mdi:bullseye-arrow
      input:
        board_events:
          name: Board events
          description: The "Events" entity of your Autodarts board.
          selector:
            entity:
              filter:
                - integration: homedarts
                  domain: event
    game_start:
      name: Game starts
      icon: mdi:flag-variant
      collapsed: true
      input:
        game_start_actions:
          name: Actions when a game starts
          description: >-
            Run when a game is set up on the board, however it is started: a
            match, a party or a training game, or the next match of a
            tournament, for example the scene for playing. Also when a game
            goes on after the idle end of the training session or after its
            winning visit was undone. Needs version
            2.1.0 or later of the integration.
          default: []
          selector:
            action: {}
    maximum:
      name: "180"
      icon: mdi:fire
      collapsed: true
      input:
        maximum_actions:
          name: Actions for a 180
          description: Run the moment the third dart of a 180 lands.
          default: []
          selector:
            action: {}
    high_finish:
      name: High finish
      icon: mdi:trophy
      collapsed: true
      input:
        high_finish_minimum:
          name: High finish from
          description: A practice leg won with a checkout of at least this score is a high finish.
          default: 100
          selector:
            number:
              min: 2
              max: 170
              step: 1
              mode: box
              unit_of_measurement: points
        high_finish_actions:
          name: Actions for a high finish
          description: Run instead of the actions for a won leg.
          default: []
          selector:
            action: {}
    bust:
      name: Bust
      icon: mdi:close-octagon
      collapsed: true
      input:
        bust_actions:
          name: Actions for a bust
          description: Run when a dart of the practice game busts the visit.
          default: []
          selector:
            action: {}
    leg:
      name: Leg won
      icon: mdi:flag-checkered
      collapsed: true
      input:
        leg_actions:
          name: Actions for a won leg
          description: >-
            Run when a dart wins a leg of the practice game. The leg that
            decides a match plays the actions for the match instead.
          default: []
          selector:
            action: {}
    match:
      name: Match won
      icon: mdi:trophy-variant
      collapsed: true
      input:
        match_actions:
          name: Actions for a won match
          description: Run when a dart decides a practice match.
          default: []
          selector:
            action: {}
    personal_best:
      name: Personal best
      icon: mdi:medal
      collapsed: true
      input:
        personal_best_actions:
          name: Actions for a personal best
          description: Run when a value beats your personal best.
          default: []
          selector:
            action: {}
    daily_goal:
      name: Daily goal
      icon: mdi:calendar-check
      collapsed: true
      input:
        daily_goal_actions:
          name: Actions for the daily goal
          description: Run when today's darts reach the daily goal.
          default: []
          selector:
            action: {}
    bull_off:
      name: Bull-off won
      icon: mdi:bullseye
      collapsed: true
      input:
        bull_off_actions:
          name: Actions for a won bull-off
          description: Run when the bull-off decides who starts the match.
          default: []
          selector:
            action: {}
    achievement:
      name: Achievement
      icon: mdi:trophy-award
      collapsed: true
      input:
        achievement_actions:
          name: Actions for an achievement
          description: >-
            Run when a named player unlocks a new tier of an achievement, such
            as a first 180 or ten legs won.
          default: []
          selector:
            action: {}
    tournament:
      name: Tournament won
      icon: mdi:tournament
      collapsed: true
      input:
        tournament_actions:
          name: Actions for a won tournament
          description: >-
            Run when the last match of a tournament is booked, after the
            actions for the won match; `who` is the winner of the tournament.
          default: []
          selector:
            action: {}
    takeout:
      name: Takeout
      icon: mdi:hand-back-left
      collapsed: true
      input:
        takeout_moments:
          name: React to the takeout
          description: >-
            Runs the two actions below while you pull the darts. Leave it off
            without such actions, so that takeouts never wait behind an effect.
          default: false
          selector:
            boolean: {}
        takeout_actions:
          name: When the takeout starts
          description: >-
            Optional. Run when a hand reaches the board to pull the darts, for
            example a bright board light. Not restored afterwards.
          default: []
          selector:
            action: {}
        board_clear_actions:
          name: When the board is clear
          description: >-
            Optional. Run when all darts are out of the board, for example your
            normal light. Not restored afterwards.
          default: []
          selector:
            action: {}
    players:
      name: Players
      icon: mdi:account-multiple
      collapsed: true
      input:
        include_bot:
          name: Also for the bot
          description: >-
            Also plays the moments of the practice game's bot: its 180, bust,
            won leg or match and won bull-off. Its darts are not in the board,
            so they stay dark by default; a leg or match the bot wins for a
            team plays anyway, because its partner wins it, too.
          default: false
          selector:
            boolean: {}
        bot_label:
          name: Word for the bot
          description: The `who` of the bot's moments.
          default: "Bot"
          selector:
            text: {}
        player_label:
          name: Word for a player without a name
          description: For example `Player` makes "Player 2".
          default: "Player"
          selector:
            text: {}
    online:
      name: Online matches
      icon: mdi:web
      collapsed: true
      input:
        online_matches:
          name: Also react to online matches
          description: >-
            Also plays the actions for a bust, a won leg and a won match of an
            online match on play.autodarts.io. Needs the online bridge of the
            integration and the browser extension Tools for Autodarts. A 180
            and the takeout of your darts come from your board anyway.
          default: false
          selector:
            boolean: {}
    effect:
      name: After the effect
      icon: mdi:timer-sand
      input:
        effect_moments:
          name: Moments with an effect
          description: >-
            The moments whose actions start an effect: only for them are the
            lights restored and the detection paused. Leave out moments
            without actions.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: Game starts
                  value: game_start
                - label: "180"
                  value: maximum
                - label: High finish
                  value: high_finish
                - label: Bust
                  value: bust
                - label: Leg won
                  value: leg
                - label: Match won
                  value: match
                - label: Personal best
                  value: personal_best
                - label: Daily goal
                  value: daily_goal
                - label: Bull-off won
                  value: bull_off
                - label: Achievement
                  value: achievement
                - label: Tournament won
                  value: tournament
        restore_lights:
          name: Restore these lights
          description: >-
            Optional. Their state is saved before an effect and restored after
            it, for example your WLED light and the room lights.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - light
                    - switch
        effect_duration:
          name: Effect duration
          description: >-
            How long an effect plays after your actions started it, before the
            lights are restored and the detection starts again. A training
            session that ends meanwhile ends the effect at once and leaves the
            detection off.
          default:
            seconds: 10
          selector:
            duration: {}
        pause_detection:
          name: Pause the detection during effects
          description: >-
            Turns the detection off while an effect plays and on again after
            it, if it was on. Use it when the effect disturbs the cameras; the
            visit on the board counts as finished when the detection stops.
            The daily goal, which is reached in the middle of a visit, never
            pauses the detection, and neither does a new best session average,
            which comes when a training session ends.
          default: false
          selector:
            boolean: {}
        detection:
          name: Detection switch
          description: The "Detection" switch of the board, for pausing it.
          default: []
          selector:
            entity:
              filter:
                - integration: homedarts
                  domain: switch

# Queued: moments play one after the other, and each effect restores the
# lights it found. A restarted run would leave the effect on and save it as the
# state to restore; parallel runs would mix effects on the same lights. Ten
# waiting moments hold a match that ends a tournament with personal bests and
# achievements.
mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: event.received
    target:
      entity_id: !input board_events
    options:
      event_type:
        - game_started
        - visit_thrown
        - visit_completed
        - bust
        - leg_won
        - match_won
        - personal_best
        - daily_goal_reached
        - bull_off_won
        - achievement_unlocked
        - tournament_finished
        - online_busted
        - online_game_shot
        - online_match_shot
  # Only when asked: every visit ends with a takeout, which would otherwise
  # wait in the queue behind an effect for nothing.
  - trigger: event.received
    enabled: !input takeout_moments
    target:
      entity_id: !input board_events
    options:
      event_type:
        - takeout_started
        - takeout_finished

variables:
  high_finish_minimum: !input high_finish_minimum
  online_matches: !input online_matches
  include_bot: !input include_bot
  bot_label: !input bot_label
  player_label: !input player_label
  # Read from the triggering state: the next event may already have replaced it.
  kind: "{{ trigger.to_state.attributes.get('event_type', '') }}"
  score: "{{ trigger.to_state.attributes.get('score') | int(0) }}"
  checkout: "{{ trigger.to_state.attributes.get('checkout') | int(0) }}"
  player: "{{ trigger.to_state.attributes.get('player') | int(0) }}"
  bot: "{{ trigger.to_state.attributes.get('bot', false) }}"
  # Template characters leave a name: some fields, such as the message of a
  # notification, are rendered once more.
  who: >-
    {% set event = trigger.to_state.attributes %}
    {%- set name = event.get('name') or event.get('winner') or '' %}
    {%- if bot %}{{ bot_label }}
    {%- elif name %}{{ name | regex_replace('[{}%#\x00-\x1f]+', '') | trim }}
    {%- elif event.get('players', 1) > 1 and player > 0 %}{{ player_label ~ ' ' ~ player }}
    {%- endif %}
  moment: >-
    {% set event = trigger.to_state.attributes %}
    {%- if kind == 'visit_thrown'
       or kind == 'visit_completed' and not event.get('thrown', false) %}
    {{- 'maximum' if score == 180 and event.get('darts') == 3 else '' }}
    {%- elif kind.startswith('online_') %}
    {#- Your own 180s and takeouts come from the board, only once. #}
    {{- {'online_busted': 'bust', 'online_game_shot': 'leg',
         'online_match_shot': 'match'}.get(kind, '') if online_matches else '' }}
    {%- elif kind == 'leg_won' and event.get('match') %}
    {#- The match_won event follows and plays the match. #}
    {%- elif kind == 'leg_won' %}{{ 'high_finish' if checkout >= high_finish_minimum else 'leg' }}
    {%- else %}
    {{- {'game_started': 'game_start', 'bust': 'bust', 'match_won': 'match',
         'personal_best': 'personal_best',
         'daily_goal_reached': 'daily_goal', 'bull_off_won': 'bull_off',
         'achievement_unlocked': 'achievement', 'tournament_finished': 'tournament',
         'takeout_started': 'takeout',
         'takeout_finished': 'board_clear'}.get(kind, '') }}
    {%- endif %}
  effect_moments: !input effect_moments
  restore_lights: !input restore_lights
  pause_detection: !input pause_detection
  detection: !input detection
  # Effects are undone; takeout and board clear set a look of their own.
  effect: "{{ moment in effect_moments }}"
  snapshot: "scene.homedarts_light_show_{{ this.entity_id.split('.')[1] }}"

conditions:
  - alias: A moment of the game
    condition: template
    value_template: "{{ moment | length > 0 }}"
  # The bot's darts are not in the board. A leg or match it wins for a team is
  # its partner's win, too.
  - alias: Not a moment of the bot, unless asked
    condition: template
    value_template: >-
      {{ include_bot or not bot
         or trigger.to_state.attributes.get('team') is not none
            and moment in ['high_finish', 'leg', 'match'] }}

actions:
  - variables:
      restoring: "{{ effect and restore_lights | length > 0 }}"
      # Whether a training session ended while the effect played.
      session_over: false
      # The daily goal is reached in the middle of a visit, which a pause
      # would end. A new best session average comes with the end of its
      # session, while the switch may still show the detection running that
      # the training session routine is stopping: a pause would start it again.
      pausing: >-
        {{ effect and moment != 'daily_goal' and pause_detection
           and detection | length > 0 and is_state(detection, 'on')
           and trigger.to_state.attributes.get('record') != 'best_session_average' }}
  - if:
      - condition: template
        value_template: "{{ restoring }}"
    then:
      - action: scene.create
        data:
          scene_id: "{{ snapshot.split('.')[1] }}"
          snapshot_entities: "{{ restore_lights }}"
  - if:
      - condition: template
        value_template: "{{ pausing }}"
    then:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ detection }}"
  # A failing light never keeps the lights from being restored.
  - continue_on_error: true
    choose:
      - conditions: "{{ moment == 'game_start' }}"
        sequence: !input game_start_actions
      - conditions: "{{ moment == 'maximum' }}"
        sequence: !input maximum_actions
      - conditions: "{{ moment == 'high_finish' }}"
        sequence: !input high_finish_actions
      - conditions: "{{ moment == 'bust' }}"
        sequence: !input bust_actions
      - conditions: "{{ moment == 'leg' }}"
        sequence: !input leg_actions
      - conditions: "{{ moment == 'match' }}"
        sequence: !input match_actions
      - conditions: "{{ moment == 'personal_best' }}"
        sequence: !input personal_best_actions
      - conditions: "{{ moment == 'daily_goal' }}"
        sequence: !input daily_goal_actions
      - conditions: "{{ moment == 'bull_off' }}"
        sequence: !input bull_off_actions
      - conditions: "{{ moment == 'achievement' }}"
        sequence: !input achievement_actions
      - conditions: "{{ moment == 'tournament' }}"
        sequence: !input tournament_actions
      - conditions: "{{ moment == 'takeout' }}"
        sequence: !input takeout_actions
      - conditions: "{{ moment == 'board_clear' }}"
        sequence: !input board_clear_actions
  - if:
      - condition: template
        value_template: "{{ restoring or pausing }}"
    then:
      # A training session that ends while the effect plays ends the effect,
      # too: the lights come back at once, before the actions of the training
      # session routine for its end, and the detection that the routine stops
      # stays off. A new session keeps the board running and lets the effect
      # play to its end.
      - wait_for_trigger:
          - trigger: event.received
            target:
              entity_id: !input board_events
            options:
              event_type:
                - session_ended
        timeout: !input effect_duration
        continue_on_timeout: true
      - variables:
          session_over: >-
            {{ wait.trigger is not none
               and wait.trigger.to_state.attributes.get('reason') != 'new_session' }}
      - delay: "{{ 0 if session_over else wait.remaining }}"
  - if:
      - condition: template
        value_template: "{{ restoring }}"
    then:
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ snapshot }}"
  - if:
      - condition: template
        value_template: "{{ pausing and not session_over and is_state(detection, 'off') }}"
    then:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ detection }}"
