start_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    plan:
      required: false
      example: doubles_day
      selector:
        select:
          custom_value: true
          translation_key: plan
          options:
            - warm_up
            - doubles_day
            - checkout_day
            - jdc_week
    name:
      required: false
      example: Tuesday doubles
      selector:
        text:
    steps:
      required: false
      example: |
        - drill: around_the_clock
          darts: 30
        - drill: bobs_27
        - drill: checkout
          rounds: 10
          options:
            low: 40
            high: 100
      selector:
        object:
    player:
      required: false
      example: Alex
      selector:
        text:
next_plan_step:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
stop_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
delete_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    name:
      required: true
      example: "Dennis"
      selector:
        text:

start_game:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    game:
      required: true
      example: "501"
      selector:
        select:
          translation_key: game
          options:
            - "101"
            - "301"
            - "501"
            - "701"
            - "901"
            - "1001"
            - cricket
            - cut_throat
            - tactics
            - wild_mouse
            - random_cricket
            - hidden_cricket
            - shanghai
            - halve_it
            - killer
            - golf
            - baseball
            - count_up
            - bermuda
            - round_the_world
            - gotcha
            - around_the_clock
            - doubles
            - checkout
            - bobs_27
            - checkout_121
            - catch_40
            - jdc_challenge
            - singles
    players:
      required: false
      example: '["Dennis", "Lea"]'
      selector:
        text:
          multiple: true
    legs:
      required: false
      selector:
        number:
          min: 1
          max: 11
          mode: box
    sets:
      required: false
      selector:
        number:
          min: 1
          max: 7
          mode: box
    in_mode:
      required: false
      selector:
        select:
          translation_key: x01_mode
          options:
            - straight
            - double
            - master
    out_mode:
      required: false
      selector:
        select:
          translation_key: x01_mode
          options:
            - straight
            - double
            - master
    bull_mode:
      required: false
      selector:
        select:
          translation_key: bull_mode
          options:
            - "25_50"
            - "50_50"
    max_rounds:
      required: false
      selector:
        number:
          min: 0
          max: 50
          mode: box
    double_out:
      required: false
      selector:
        boolean: {}
    double_in:
      required: false
      selector:
        boolean: {}
    bull_off:
      required: false
      selector:
        boolean: {}
    bull_off_distance:
      required: false
      selector:
        boolean: {}
    teams:
      required: false
      selector:
        boolean: {}
    three_in_a_bed:
      required: false
      selector:
        boolean: {}
    start_scores:
      required: false
      example: "[501, 301]"
      selector:
        text:
          type: number
          multiple: true
    holes:
      required: false
      selector:
        select:
          options:
            - "9"
            - "18"
    rounds:
      required: false
      selector:
        number:
          min: 1
          max: 20
          mode: box
    halve_on_miss:
      required: false
      selector:
        boolean: {}
    order:
      required: false
      selector:
        select:
          translation_key: world_order
          options:
            - ascending
            - descending
            - random
    target_score:
      required: false
      example: "301"
      selector:
        number:
          min: 101
          max: 1001
          mode: box
    bot_level:
      required: false
      example: "60"
      selector:
        number:
          min: 0
          max: 120
          mode: box

export:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    format:
      required: false
      default: csv
      selector:
        select:
          translation_key: export_format
          options:
            - csv
            - json
    what:
      required: false
      default: all
      selector:
        select:
          translation_key: export_what
          options:
            - sessions
            - matches
            - profiles
            - all
    folder:
      required: false
      example: "/media/homedarts/exports"
      selector:
        text:

backup:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts

restore:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    file:
      required: true
      example: "/media/homedarts/backups/board-id/autodarts-board-20261024-201500.json"
      selector:
        text:
    mode:
      required: false
      default: replace
      selector:
        select:
          translation_key: restore_mode
          options:
            - replace
            - merge

save_highlight:
  fields:
    camera:
      required: true
      example: "camera.autodarts_board_camera_1"
      selector:
        entity:
          filter:
            - domain: camera
    folder:
      required: false
      example: "/media/homedarts/highlights"
      selector:
        text:
    player:
      required: false
      example: "Alex"
      selector:
        text:
    label:
      required: false
      example: "180"
      selector:
        text:
    clip_camera:
      required: false
      example: "camera.dartroom"
      selector:
        entity:
          filter:
            - domain: camera
    clip_lookback:
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: s
    clip_duration:
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s

voice_sound:
  fields:
    pack:
      required: true
      example: "russ-bray"
      selector:
        text:
    keys:
      required: true
      example: '["yr_40", "you_require"]'
      selector:
        text:
          multiple: true

generate_voice_pack:
  fields:
    tts_entity:
      required: true
      example: "tts.piper"
      selector:
        entity:
          filter:
            - domain: tts
    language:
      required: true
      example: "en-GB"
      selector:
        text:
    pack:
      required: true
      example: "piper-en"
      selector:
        text:
    voice:
      required: false
      example: "en_GB-alan-medium"
      selector:
        text:

link_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    player:
      required: true
      example: "Dennis"
      selector:
        text:
    person:
      required: true
      example: "person.dennis"
      selector:
        entity:
          filter:
            domain: person

unlink_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    player:
      required: true
      example: "Dennis"
      selector:
        text:

rename_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    player:
      required: true
      example: "Sammy"
      selector:
        text:
    new_name:
      required: true
      example: "Sam"
      selector:
        text:

start_tournament:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    boards:
      required: false
      selector:
        device:
          multiple: true
          filter:
            integration: homedarts
    players:
      required: false
      example: '["Dennis", "Lea", "Max", "Kim"]'
      selector:
        text:
          multiple: true
    start_scores:
      required: false
      example: "[501, 501, 301]"
      selector:
        text:
          type: number
          multiple: true
    format:
      required: false
      example: round_robin
      selector:
        select:
          translation_key: tournament_format
          options:
            - round_robin
            - knockout
            - double_knockout
            - groups_knockout
    game:
      required: false
      example: "501"
      selector:
        select:
          translation_key: game
          options:
            - "101"
            - "301"
            - "501"
            - "701"
            - "901"
            - "1001"
            - cricket
            - cut_throat
            - tactics
            - wild_mouse
            - random_cricket
            - hidden_cricket
    legs:
      required: false
      selector:
        number:
          min: 1
          max: 11
          mode: box
    sets:
      required: false
      selector:
        number:
          min: 1
          max: 7
          mode: box
    double_out:
      required: false
      selector:
        boolean: {}
    double_in:
      required: false
      selector:
        boolean: {}
    bull_off:
      required: false
      selector:
        boolean: {}
    bull_off_distance:
      required: false
      selector:
        boolean: {}
    third_place:
      required: false
      selector:
        boolean: {}
    groups:
      required: false
      example: 4
      selector:
        number:
          min: 0
          max: 8
          mode: box
    advance:
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 4
          mode: box
    random_draw:
      required: false
      selector:
        boolean: {}
    seed:
      required: false
      selector:
        number:
          min: 1
          max: 999999
          mode: box
    pause:
      required: false
      selector:
        number:
          min: 0
          max: 600
          mode: box
          unit_of_measurement: s
    summary:
      required: false
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: s

stop_tournament:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts

next_tournament_match:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts

correct_dart:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    dart:
      required: true
      example: "2"
      selector:
        number:
          min: 1
          max: 3
          mode: box
    segment:
      required: false
      example: "T20"
      selector:
        text:
    x:
      required: false
      example: "0.035"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box
    y:
      required: false
      example: "0.608"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box

throw_dart:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    segment:
      required: false
      example: "T20"
      selector:
        text:
    x:
      required: false
      example: "0.035"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box
    y:
      required: false
      example: "0.608"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box
    player:
      required: false
      example: "Alex"
      selector:
        text:

enter_visit:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: homedarts
    score:
      required: false
      example: "140"
      selector:
        number:
          min: 0
          max: 180
          mode: box
    checkout:
      required: false
      example: "true"
      selector:
        boolean:
    darts:
      required: false
      example: "2"
      selector:
        number:
          min: 1
          max: 3
          mode: box
    darts_at_double:
      required: false
      example: "1"
      selector:
        number:
          min: 0
          max: 3
          mode: box
    player:
      required: false
