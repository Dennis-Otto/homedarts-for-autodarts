# The settings of the screenshot bot of the blueprint (screenshot-bot.yml), which
# runs scripts/screenshots.sh; they belong to this project
# (docs/development.md#screenshot-bot).

# Each renders side by side on a runner of its own, with its name in
# SCREENSHOTS_SHARD: one of the four groups of images (GROUPS in
# tests/e2e/screenshots.py) in one language, from a fresh demo, and the recording of
# the live demo. tests/test_screenshot_groups.py keeps them in step with the groups.
shards = [
  "en-1",
  "en-2",
  "en-3",
  "en-4",
  "de-1",
  "de-2",
  "de-3",
  "de-4",
  "timeline",
]

# The recording of the games that the live demo of the website plays, which the
# shard timeline makes, besides the pictures.
files = ["docs/demo/timeline.json"]

# The hosts that the render jobs reach besides those of the steps of the shared job:
# Home Assistant from GitHub's registry, Playwright from Microsoft's, pngquant from
# Launchpad, and the icons of Home Assistant's other integrations, which the images
# show. Harden-Runner blocks every other host.
hosts = [
  "ghcr.io:443",
  "pkg-containers.githubusercontent.com:443",
  "mcr.microsoft.com:443",
  "*.data.mcr.microsoft.com:443",
  "launchpad.net:443",
  "launchpadlibrarian.net:443",
  "brands.home-assistant.io:443",
]
