# The settings of the screenshot bot of the blueprint (screenshot-bot.yml), which
# runs scripts/screenshots.sh; they belong to this project
# (docs/development.md#screenshot-bot).

# Each renders side by side on a runner of its own, with its name in
# SCREENSHOTS_SHARD: one of the four groups of images (GROUPS in
# tests/e2e/screenshots.py) in one language, from a fresh demo, and the recording of
# the live demo. tests/test_screenshot_groups.py keeps them in step with the groups.
shards = [
  "en-1",
  "en-2",
  "en-3",
  "en-4",
  "de-1",
  "de-2",
  "de-3",
  "de-4",
  "timeline",
]

# The recording of the games that the live demo of the website plays, which the
# shard timeline makes, besides the pictures.
files = ["docs/demo/timeline.json"]

# The hosts that the render jobs reach besides those of the steps of the shared job:
# Home Assistant from GitHub's registry, Playwright from Microsoft's, pngquant from
# Launchpad, and the icons of Home Assistant's other integrations, which the images
# show. Harden-Runner blocks every other host.
hosts = [
  "ghcr.io:443",
  "pkg-containers.githubusercontent.com:443",
  "mcr.microsoft.com:443",
  "*.data.mcr.microsoft.com:443",
  "launchpad.net:443",
  "launchpadlibrarian.net:443",
  "brands.home-assistant.io:443",
]

# launchpad.net often keeps a runner waiting for minutes before it answers, while
# Harden-Runner lets it through: the render jobs don't wait for it before the script
# runs, as the jobs of the visual check don't. Only tests/e2e/pngquant.sh needs it,
# in the container of the images, a few minutes later and with retries of its own
# (docs/development.md#network-of-the-jobs). The jobs still allow it.
skip_wait = ["launchpad.net:443"]

# The time limit of the step that renders a shard, in minutes, as the step of the
# visual check that renders a group has it: a group takes about eight. Each group of
# scripts/screenshots.sh ends three minutes before it, so that the screenshot tool
# can end its demo and print the state of its containers before the step runs out
# of time (docs/development.md#when-a-step-hangs).
timeout_minutes = 21

# What a shard that failed leaves, kept as an artifact for seven days: the pages
# that a failed capture saved, the seconds of the sections and the images of the
# group so far.
failure_folder = "tests/e2e/artifacts"
