# Every label of the repository. The Labels workflow of the issue assistant
# (https://github.com/Dennis-Otto/issue-assistant) creates missing labels and updates
# color and description from this file when it changes on main; it never deletes a
# label. Rename a label on GitHub first, then here.
#
# group decides who sets a label:
#   type       the kind of an issue; the issue forms set one, the issue assistant may correct it
#   area       the part of the integration; set from the Area field of the bug report and by the assistant
#   topic      cross-cutting topics the assistant may add
#   lifecycle  set and removed by the issue assistant's rules (docs/development.md#issue-assistant)
#   decision   set by the maintainer only
#   contribution set by the maintainer; the assistant's digest names candidates
#   release    set on pull requests by the Pull request labels workflow, they sort the release notes
#
# ask = false keeps the assistant from asking reporters of that kind for information.

# Types

[[label]]
name = "bug"
color = "d73a4a"
description = "Something isn't working"
group = "type"

[[label]]
name = "enhancement"
color = "a2eeef"
description = "New feature or improvement"
group = "type"
ask = false

[[label]]
name = "question"
color = "d876e3"
description = "A question about setup or use"
group = "type"

[[label]]
name = "documentation"
color = "0075ca"
description = "Improvements or additions to documentation"
group = "type"
form_options = ["Documentation"]

[[label]]
name = "compatibility"
color = "1d76db"
description = "Board and Board Manager compatibility reports"
group = "type"

[[label]]
name = "feedback"
color = "0e8a16"
description = "Tester reports and experiences from real boards"
group = "type"
ask = false

[[label]]
name = "maintenance"
color = "6f42c1"
description = "CI, repository maintenance and release tooling"
group = "type"

# Areas: each option of the Area field of the bug report belongs to one label,
