# Lifecycle

[[label]]
name = "needs-triage"
color = "fbca04"
description = "Not yet reviewed by a maintainer"
group = "lifecycle"

[[label]]
name = "needs-info"
color = "fef2c0"
description = "Waiting for the reporter: reminder after 15 days, closed after 30 days"
group = "lifecycle"

[[label]]
name = "stale"
color = "f9d0c4"
description = "Reminder sent; closes 15 days later without an answer"
group = "lifecycle"

[[label]]
name = "possible-duplicate"
color = "e4e4e4"
description = "Closes as a duplicate 3 days after the notice unless someone objects"
group = "lifecycle"

[[label]]
name = "duplicate"
color = "cfd3d7"
description = "This issue or pull request already exists"
group = "lifecycle"

[[label]]
name = "invalid"
color = "e4e669"
description = "Spam, or not about this integration"
group = "lifecycle"

[[label]]
name = "fixed-in-next-release"
color = "c2e0c6"
description = "Fixed on main; closes with a link when a release ships the fix"
group = "lifecycle"

