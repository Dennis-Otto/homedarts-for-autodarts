name: Translations

# The translation bot of this integration: for each language with texts that are
# missing or older than their English source, it keeps one issue open, labeled
# translations and help wanted for native speakers to find, and closes it with thanks
# once the language is up to date. scripts/translations.mjs reads the history of main;
# docs/development.md describes it.

on:
  push:
    branches: [main]
    paths:
      - custom_components/homedarts/translations/**
      - custom_components/homedarts/frontend/text/**
      - scripts/translations.mjs
      - .github/workflows/translations.yml
  schedule:
    # Weekly, also for a "Translations-checked:" line in a commit that changed no text.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  issues:
    name: Translation issues
    # The issues follow main alone, also when someone runs the workflow on a branch.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the history of the texts
      issues: write # one issue per language: open, update and close it
    steps:
      # The bot may write issues, so it reaches GitHub alone: the history from
      # github.com and the issues through its API; Node is on the runner already.
      # Without sudo and Docker no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of
        # the blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # The whole history: when each text last changed is what the bot reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node alone: the bot needs no packages, and a job that writes restores no cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Open, update and close the translation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/translations.mjs --sync
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
