name: Translations

# The translation bot of this integration: for each language with texts that are
# missing or older than their English source, it keeps one issue open, labeled
# translations and help wanted for native speakers to find, and closes it with thanks
# once the language is up to date. scripts/translations.mjs reads the history of main;
# docs/development.md describes it.

on:
  push:
    branches: [main]
    paths:
      - custom_components/homedarts/translations/**
      - custom_components/homedarts/frontend/text/**
      - scripts/translations.mjs
      - .github/workflows/translations.yml
  schedule:
    # Weekly, also for a "Translations-checked:" line in a commit that changed no text.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  issues:
    name: Translation issues
    # The issues follow main alone, also when someone runs the workflow on a branch.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the history of the texts
      issues: write # one issue per language: open, update and close it
    steps:
      # The bot may write issues, so it reaches GitHub alone: the history from
      # github.com and the issues through its API; Node is on the runner already.
      # Without sudo and Docker no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
      # The whole history: when each text last changed is what the bot reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node alone: the bot needs no packages, and a job that writes restores no cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Open, update and close the translation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/translations.mjs --sync
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
