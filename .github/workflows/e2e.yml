name: Docker E2E

# The end-to-end tests in Docker: Home Assistant with the integration and a simulated
# Board Manager (tests/e2e/run.sh, the jobs "scenario"), and the cards in a real
# browser (browser.sh, the jobs "browser", each running one or two of the four shards
# of the steps). They all run side by side. Every push to main, every night and every
# manual run tests everything. A pull request runs the tests only when it changes what
# they run or mount; one that changes only the documentation or other workflows skips
# them. Either way the job "e2e" reports the result, and it is the check that main
# requires.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night, also as an early warning against the next Home Assistant release.
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions: {}

env:
  # The oldest release that hacs.json and the blueprints promise to support, for the
  # scenario and the browser; only its digest moves (.github/renovate.json5).
  OLDEST_HOME_ASSISTANT: ghcr.io/home-assistant/home-assistant:2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# With pipefail, as tests/test_e2e_workflow.py runs the steps: a command that fails
# inside a pipeline fails its step too, instead of passing unnoticed.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # the list of the files that a pull request changes
    outputs:
      run: ${{ steps.files.outputs.run }}
      demo: ${{ steps.files.outputs.demo }}
    steps:
      # The files of the pull request come from GitHub's API; no step needs sudo or
      # Docker.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
          disable-sudo-and-containers: true
      # No checkout and no action of a third party: the files of the pull request
      # come from the API, as in pull-request-title.yml.
      - name: Decide whether the tests have to run
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # What the tests run or mount: the integration, the blueprints, the tests
          # with the demo and the browser test, the recorded answers of the Board
          # Manager, axe-core of the npm packages, and this workflow.
          # tests/test_consistency.py keeps it in step with the mounts.
          tested='^(custom_components/|blueprints/|tests/e2e/|tests/fixtures/board_manager/|package(-lock)?\.json$|\.github/workflows/e2e\.yml$)'
          # What the live demo plays: the cards, the page of the website with its
          # branding and hook, its browser test and this workflow. A pull request that
          # changes only these, such as one of the screenshot bot with a new recording,
          # starts the one job of the live demo, not the Home Assistant jobs.
          demo='^(custom_components/homedarts/frontend/|docs/demo/|docs/branding/|scripts/mkdocs_hooks\.py$|tests/e2e/(live_demo\.(py|sh)|requirements-browser\.txt)$|\.github/workflows/e2e\.yml$)'
          # When in doubt, the tests run.
          run=true
          demo_run=true
          demo_reason=""
          if [[ "$EVENT" != pull_request ]]; then
            reason="A run of $EVENT tests everything."
          elif ((${CHANGED:-0} >= 3000)); then
            reason="The pull request changes $CHANGED files, more than the API lists; the tests run."
          # A renamed file counts by its old name too: moving a file away runs the tests.
          elif ! files="$(gh api "repos/$GH_REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')"; then
            reason="The files of the pull request are unknown; the tests run."
            echo "::warning::$reason"
          else
            if first="$(grep -E -m 1 "$tested" <<<"$files")"; then
              reason="The pull request changes $first, which the tests run or mount; they run."
            else
              run=false
              reason="The pull request changes nothing that the tests run or mount; they are skipped."
            fi
            if first="$(grep -E -m 1 "$demo" <<<"$files")"; then
              demo_reason="The pull request changes $first, which the live demo plays; it runs."
            else
              demo_run=false
              demo_reason="The pull request changes nothing that the live demo plays; it is skipped."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "demo=$demo_run" >> "$GITHUB_OUTPUT"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$demo_reason" ]]; then
            echo "$demo_reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The scenario of tests/e2e/run.sh, on each Board Manager and the oldest supported
  # Home Assistant, beside the browser jobs.
  scenario:
    name: scenario (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1: classic Board Manager app, 2: headless board with /api/system and mDNS.
          - name: Board Manager 1
            board_manager: 1
          - name: Board Manager 2
            board_manager: 2
          - name: Home Assistant 2026.8.0
            board_manager: 2
            oldest: true
    env:
      BOARD_MANAGER: ${{ matrix.board_manager }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      # Only the hosts of the steps: the code from github.com and Home Assistant from
      # GitHub's registry (ghcr.io, pkg-containers.githubusercontent.com). Home
      # Assistant itself reaches none (tests/e2e/offline/radio_browser).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A step that hangs fails at a time limit of its own, three minutes or more
      # before that of the job, so that the steps after it keep its logs and explain
      # it: GitHub cancels a job at its limit, and then no step after it runs. With
      # exec, the signal with which GitHub stops the step reaches the script itself,
      # which prints the state of its containers before it ends
      # (docs/development.md#when-a-step-hangs).
      - name: Run Home Assistant end-to-end tests
        timeout-minutes: 7
        env:
          HOME_ASSISTANT_IMAGE: ${{ matrix.oldest && env.OLDEST_HOME_ASSISTANT || '' }}
        run: exec bash tests/e2e/run.sh
      - name: Keep logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-scenario-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: scenario (${{ matrix.name }})
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The cards in a real browser, against the current and the oldest supported Home
  # Assistant: its native card forms and dashboard strategy. The four shards of the
  # steps of a version run at once, each on a demo instance of its own (BROWSER_SHARD
  # and BROWSER_WORKERS in tests/e2e/browser.sh), on three runners: the groups 1 and 2
  # share one, and the groups 3 and 4 have one each. Safari's WebKit, in group 4,
  # twice failed to load the scripts of Home Assistant itself while a second browser
  # beside it opened the nine screens of group 3 at once on the four cores of a runner,
  # so it shares the CPU with no other browser.
  browser:
    name: browser (${{ matrix.home_assistant.name }}, ${{ matrix.part.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        home_assistant:
          - name: current Home Assistant
          - name: Home Assistant 2026.8.0
            oldest: true
        part:
          # The cards, games and forms beside the steady heights: two workers.
          - name: groups 1 and 2
            shard: 1/2
            workers: 2
          # The tablet, every screen size and the dartboard without Autodarts.
          - name: group 3
            shard: 3/4
            workers: 1
          # The touch screens, Safari and the accessibility check.
          - name: group 4
            shard: 4/4
            workers: 1
    env:
      BOARD_MANAGER: 2
      BROWSER_SHARD: ${{ matrix.part.shard }}
      BROWSER_WORKERS: ${{ matrix.part.workers }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      # Only the hosts of the steps: the code from github.com, Home Assistant from
      # GitHub's registry (ghcr.io, pkg-containers.githubusercontent.com), Playwright
      # from Microsoft's (mcr.microsoft.com, *.data.mcr.microsoft.com), axe-core from
      # npm (registry.npmjs.org) and the Python packages of the browser test (pypi.org,
      # files.pythonhosted.org). Home Assistant itself reaches none
      # (tests/e2e/offline/radio_browser).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # axe-core of package-lock.json checks the accessibility of the cards.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked packages of the frontend
        run: npm ci --ignore-scripts
      # Its own time limit, as the scenario's: about three times its longest run.
      - name: Check the dashboard cards in a real browser
        timeout-minutes: 12
        env:
          HOME_ASSISTANT_IMAGE: ${{ matrix.home_assistant.oldest && env.OLDEST_HOME_ASSISTANT || '' }}
        run: exec bash tests/e2e/browser.sh
      - name: Keep logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-browser-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: browser (${{ matrix.home_assistant.name }}, ${{ matrix.part.name }})
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The live demo of the website in a real browser: the page of docs/demo/ plays the
  # recorded games with the cards of this pull request, in every language, on a desktop
  # and a phone, without an error in the console (tests/e2e/live_demo.sh). It needs
  # no Home Assistant, only the Playwright image and its locked packages.
  live-demo:
    name: live demo
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Play the live demo in a real browser
        timeout-minutes: 7
        run: bash tests/e2e/live_demo.sh
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-demo-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: live demo
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # The one check of the end-to-end tests that main requires. A matrix skipped by its
  # condition reports none of its names, and a skipped job counts as passed, so this
  # job always runs: it passes when every test passed, or when the pull request had
  # nothing for them to test, and fails when one failed, was cancelled or didn't run.
  gate:
    name: e2e
    if: always()
    needs: [changes, scenario, browser, live-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The gate reads the results of the other jobs; it needs no sudo or Docker, and
      # github.com only for the explanations of the PR coach after a failure.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
          disable-sudo-and-containers: true
      - name: Pass when every test that had to run passed
        env:
          WANTED: ${{ needs.changes.outputs.run }}
          DEMO: ${{ needs.changes.outputs.demo }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results="$(jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<<"$NEEDS")"
          echo "$results"
          echo "$results" >> "$GITHUB_STEP_SUMMARY"
          # Skipped tests pass only when the changes job decided they had nothing to do:
          # the live demo by its own decision, the Home Assistant jobs by theirs.
          if ! jq -e --arg wanted "$WANTED" --arg demo "$DEMO" '.changes.result == "success" and
            ([to_entries[] | select(.key != "changes")
              | (if .key == "live-demo" then $demo else $wanted end) as $job
              | .value.result
              | . == "success" or ($job != "true" and . == "skipped")] | all)' <<<"$NEEDS" >/dev/null; then
            echo "::error::An end-to-end test that had to run didn't pass; the jobs above show which."
            exit 1
          fi
          if [[ "$WANTED" == true || "$DEMO" == true ]]; then
            echo "Every end-to-end test that had to run passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing that the end-to-end tests run or mount changed; none had to run." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach needs .github/blueprint.py and the explanations, nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure()
        with:
          persist-credentials: false
          sparse-checkout: .github
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml. Each
      # job that failed explains itself as well.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: e2e
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # Not required: warns a week or two before a Home Assistant release breaks anything.
  beta:
    name: e2e (Home Assistant beta)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BOARD_MANAGER: 2
      # The moving beta tag on purpose: this job tests what users get next.
      HOME_ASSISTANT_IMAGE: ghcr.io/home-assistant/home-assistant:beta
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      # The hosts of the scenario and the browser test, as in the jobs above.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Their own time limits, as in the jobs above.
      - name: Run Home Assistant end-to-end tests
        timeout-minutes: 7
        run: exec bash tests/e2e/run.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked packages of the frontend
        run: npm ci --ignore-scripts
      # Every group of steps, one after another, so that Safari's WebKit shares the
      # CPU with no other browser, as in the jobs "browser".
      - name: Check the dashboard cards in a real browser
        timeout-minutes: 15
        run: exec bash tests/e2e/browser.sh
      - name: Keep logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-beta-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: e2e (Home Assistant beta)
        run: python3 .github/blueprint.py coach explain "$CHECK"
