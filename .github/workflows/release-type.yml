name: Release type

# The type of a pull request's title decides the next release: feat, fix and perf, and
# every type with a !, make one that HACS offers to every installation, which then
# restarts Home Assistant for it. Such a title has to change the package that HACS
# installs: the integration, its blueprints or hacs.json. A pull request that changes
# only workflows, tests, the screenshot tool, the pictures or the documentation is
# titled ci:, test:, docs: or chore:, and its notes would only tell users about what
# they never see (#676, docs/releases.md#which-type-a-pull-request-takes). The check
# release type, which main requires, runs scripts/release_type.py for each title and
# each push.

on:
  # edited: a new title runs the check again.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: release-type-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# With pipefail: a failure of the API fails the step instead of passing an empty list.
defaults:
  run:
    shell: bash

jobs:
  release-type:
    name: release type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the list of the files that a pull request changes
    steps:
      # The files of the pull request come from GitHub's API, the script and the
      # explanations of the PR coach from a sparse checkout; no step needs sudo or
      # Docker.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of
        # the blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # The script, and .github/blueprint.py with the explanations for the PR coach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/release_type.py
          sparse-checkout-cone-mode: false
      - name: Check that the type of the title fits the files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The title as it is now, not as the event of the run had it: a run again,
          # also one of the flaky-test bot, checks the title that the pull request has.
          pull="$(gh api "repos/$GH_REPO/pulls/$NUMBER" --jq '"\(.changed_files) \(.title)"')"
          read -r CHANGED TITLE <<<"$pull"
          export CHANGED TITLE
          echo "The title: $TITLE"
          # Each file of the pull request, and the old name of a renamed one: a file
          # moved out of the integration changes it as well.
          gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' |
            python3 scripts/release_type.py
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          CHECK: release type
        run: python3 .github/blueprint.py coach explain "$CHECK"
