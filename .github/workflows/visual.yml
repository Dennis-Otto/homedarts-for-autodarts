name: Visual check

# Renders every image of the documentation from the demo, with its frozen clock, for
# each pull request that changes the integration with its cards, the blueprints that
# the demo shows or the screenshot tool, and compares them with the committed ones
# pixel by pixel. The images come in four fixed groups
# (GROUPS in tests/e2e/screenshots.py): each group of each language renders on a
# runner of its own from a fresh demo, all side by side, and then the compare job of
# a language puts its groups together and compares them (tests/e2e/collect.sh), as
# tests/e2e/visual.sh does on one machine. A group whose files an earlier run of
# this check or of the screenshot bot already rendered, on a branch of this
# repository, takes the images of that run instead (tests/e2e/render_key.py): so a
# pull request that "Update branches" brought up to date without a change of those
# files renders nothing anew. It only reports: the summary lists every
# image that looks different with the share of its pixels that changed, the artifact
# holds the images before and after with their differences, and visual-comment.yml
# writes the list into one comment on the pull request. An intended change reaches
# docs/images through the screenshot bot after the merge. An image that can't be
# rendered fails the check, and the other language still gets its report.

on:
  pull_request:
    paths:
      - blueprints/automation/homedarts/**
      - custom_components/homedarts/**
      - "!custom_components/homedarts/LICENSE"
      - "!custom_components/homedarts/quality_scale.yaml"
      - "!custom_components/homedarts/strings.json"
      # Release-please writes the version into the manifest in its pull request, which
      # comes anew after every merge to main. The demo shows only the major version,
      # and the screenshot bot renders that after the release, so the pull request
      # would render every image to report no difference.
      - "!custom_components/homedarts/manifest.json"
      - tests/e2e/**
      - "!tests/e2e/browser.py"
      - "!tests/e2e/shards.py"
      - "!tests/e2e/browser.sh"
      - "!tests/e2e/run.sh"
      - "!tests/e2e/configuration.yaml"
      - "!tests/e2e/README.md"
      - "!tests/e2e/accessibility-baseline.toml"
      - tests/fixtures/board_manager/**
      - "!tests/fixtures/board_manager/README.md"
      - .github/workflows/visual.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: render (${{ matrix.language }}, ${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    # The demo takes about two minutes, the images of the longest group about six;
    # the step that renders them ends after 21 minutes.
    timeout-minutes: 25
    permissions:
      # The images of an earlier run with the same key (tests/e2e/render_key.py).
      actions: read
      contents: read
    strategy:
      # A group that fails leaves the other groups and the other language running.
      fail-fast: false
      matrix:
        language: [en, de]
        group: [1, 2, 3, 4]
    steps:
      # Only the hosts of the steps: the code from github.com, Home Assistant from
      # GitHub's registry (ghcr.io, pkg-containers.githubusercontent.com), Playwright
      # from Microsoft's (mcr.microsoft.com, *.data.mcr.microsoft.com), pngquant from
      # Launchpad (launchpad.net, launchpadlibrarian.net) and the Python packages of
      # the tool (pypi.org, files.pythonhosted.org), and the images of an earlier
      # run with the same key through the API (api.github.com). Home Assistant itself
      # reaches only the icons of its other integrations, which the images show
      # (brands.home-assistant.io).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            launchpad.net:443
            launchpadlibrarian.net:443
            pypi.org:443
            files.pythonhosted.org:443
            brands.home-assistant.io:443
      # GitHub's DNS experiment on some of its runners hides the lookups from
      # Harden-Runner, which then blocks the hosts of the job and of the runner, until
      # the timeout of the job. Harden-Runner undoes it itself only when its feature
      # flags come within 3 s (docs/development.md#network-of-the-jobs).
      - name: Let Harden-Runner see the DNS lookups
        run: |
          dropins=(/etc/systemd/resolved.conf.d/90-egress-proxy.conf /run/systemd/resolved.conf.d/90-egress-proxy.conf)
          if [[ ! -e ${dropins[0]} && ! -e ${dropins[1]} ]] && ! grep -qs 127.0.0.100 /etc/resolv.conf; then
            exit 0
          fi
          echo "::notice::GitHub's DNS experiment is on this runner; taking it out of the way of Harden-Runner."
          sudo rm -f "${dropins[@]}"
          sudo systemctl restart systemd-resolved
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl stop egress-dns-resolver.service egress-outbound-proxy.service || true
          sudo resolvectl flush-caches || true
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute. All
        # but launchpad.net, which often keeps a runner waiting for minutes while
        # Harden-Runner lets it through; only the container of the images needs it, long
        # after that minute (docs/development.md#network-of-the-jobs).
        timeout-minutes: 4
        env:
          HOSTS: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            launchpadlibrarian.net:443
            pypi.org:443
            files.pythonhosted.org:443
            brands.home-assistant.io:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The key of the files that the images are rendered from, and the newest run
      # of the visual check or of the screenshot bot from a branch of this repository,
      # never of a fork, that kept images with it: those are the images that a render
      # would make, byte for byte. A pull request takes them, a run on demand renders
      # anew (docs/development.md#images-rendered-once).
      - name: Look for the same images in an earlier run
        id: earlier
        env:
          LANGUAGE: ${{ matrix.language }}
          GROUP: ${{ matrix.group }}
          REUSE: ${{ github.event_name == 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/e2e/render_key.py find "$LANGUAGE" "$GROUP"
      # A download that fails leaves the render to the next step.
      - name: Take the images of the earlier run
        id: reused
        if: ${{ steps.earlier.outputs.run-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.earlier.outputs.name }}
          run-id: ${{ steps.earlier.outputs.run-id }}
          github-token: ${{ github.token }}
          path: tests/e2e/artifacts/rendered
      # A step that hangs fails at a time limit of its own, three minutes or more
      # before that of the job, so that the steps after it keep its logs and explain
      # it: GitHub cancels a job at its limit, and then no step after it runs. With
      # exec, the signal with which GitHub stops the step reaches the script itself,
      # which prints the state of its containers before it ends
      # (docs/development.md#when-a-step-hangs).
      - name: Render the images of the group with the frozen clock
        if: ${{ steps.reused.outcome != 'success' }}
        timeout-minutes: 21
        env:
          LANGUAGES: ${{ matrix.language }}
          SCREENSHOT_GROUP: ${{ matrix.group }}/4
          IMAGES: tests/e2e/artifacts/rendered
        run: exec bash tests/e2e/screenshots.sh
      - name: List how long the sections took
        if: ${{ !cancelled() }}
        run: |
          for table in tests/e2e/artifacts/screenshots-*.md; do
            if [[ -f "$table" ]]; then
              cat "$table" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      # The seconds of the group, for the table of all groups of the language in the
      # job that compares them (tests/e2e/group_times.py). An artifact of their own: the
      # folder of the images belongs to the container that rendered them.
      - name: Keep the seconds of the group
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: times-${{ matrix.language }}-${{ matrix.group }}
          path: tests/e2e/artifacts/screenshots-*.json
          if-no-files-found: ignore
          retention-days: 1
      # Under the key of what they are rendered from, also when they came from an
      # earlier run, for the job that puts the groups together and for the runs of
      # the next week.
      - name: Keep the images of the group
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.earlier.outputs.name }}
          path: tests/e2e/artifacts/rendered/
          if-no-files-found: error
          retention-days: 7
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-failure-${{ matrix.language }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: tests/e2e/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: render (${{ matrix.language }}, ${{ matrix.group }}/4)
        run: python3 .github/blueprint.py coach explain "$CHECK"

  compare:
    name: compare (${{ matrix.language }})
    needs: render
    # Also after a failed group: the other language still gets its report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [en, de]
    steps:
      # The code and Pillow for the comparison; Harden-Runner itself allows the
      # storage of the artifacts. No step needs sudo or Docker.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          disable-sudo-and-containers: true
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the images of every group
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rendered-${{ matrix.language }}-*
          path: tests/e2e/artifacts
      - name: Install Pillow for the comparison
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes -r tests/e2e/requirements-browser.txt
      - name: Put the groups together and compare them with the committed images
        timeout-minutes: 5
        env:
          LANGUAGES: ${{ matrix.language }}
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: bash tests/e2e/collect.sh
      - name: List the images that look different
        run: cat tests/e2e/artifacts/visual/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Take the seconds of every group
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: times-${{ matrix.language }}-*
          path: tests/e2e/artifacts
      # Every group with its seconds; one that took more than one and a half times as
      # long as the shortest is marked, so that GROUPS of screenshots.py gets a new
      # balance (docs/development.md#groups-side-by-side).
      - name: List how long the groups took
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        env:
          LANGUAGE: ${{ matrix.language }}
        run: python3 tests/e2e/group_times.py "$LANGUAGE" tests/e2e/artifacts >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the images before and after, with their differences
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-${{ matrix.language }}
          path: tests/e2e/artifacts/visual/
          if-no-files-found: error
          retention-days: 14
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: compare (${{ matrix.language }})
        run: python3 .github/blueprint.py coach explain "$CHECK"
