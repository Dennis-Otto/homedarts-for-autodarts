name: Screenshot bot

# Keeps the images of the documentation in step with the cards. After a change of
# the cards or of the screenshot tool reaches main, after a release, every week, and
# on demand, it renders every image of docs/images anew from the demo, with its
# frozen clock. The images come in three fixed groups (GROUPS in
# tests/e2e/screenshots.py): each group of each language renders on a runner of its
# own from a fresh demo, all side by side, and the collect job of a language puts its
# groups together (tests/e2e/collect.sh), as tests/e2e/visual.sh does on one machine.
# A release writes its version into the manifest; the frozen demo shows only its
# major version, in online-bridge.png, so a new major version changes that image. The
# maintainer or the release app merges a release, so its push starts the bot like any
# other, and the visual checks of later pull requests don't report the image as
# changed for days. When the pixels of any image changed, it opens or updates one
# pull request, "docs: update the screenshots of the cards", as the release app, and
# turns on auto-merge, so that the images follow once the checks pass. An image whose
# pixels stayed the same keeps its file; a pull request that main has caught up with
# in the meantime closes. Only the rendered images go over those of main, so the
# diagrams in docs/images, which main may have anew by then, stay as they are, and an
# image that the tool no longer renders goes. A language that fails to render
# doesn't hold back the other: the pull request takes the language that rendered and
# keeps the rendered images it had for the other, from the app's own branch of this
# repository; a pull request from a fork's branch of the same name gives it nothing.
# The same pull request brings the recording that the live demo of the website plays,
# docs/demo/timeline.json: the timeline job lets the integration play the games of
# the demo anew (scripts/record_demo.py), so that the demo follows the integration and
# the cards as the images do.

on:
  push:
    branches: [main]
    paths:
      - custom_components/homedarts/frontend/**
      - custom_components/homedarts/manifest.json
      - tests/e2e/**
      - "!tests/e2e/browser.py"
      - "!tests/e2e/shards.py"
      - "!tests/e2e/browser.sh"
      - "!tests/e2e/run.sh"
      - "!tests/e2e/configuration.yaml"
      - "!tests/e2e/README.md"
      - "!tests/e2e/accessibility-baseline.toml"
      - tests/fixtures/board_manager/**
      - "!tests/fixtures/board_manager/README.md"
      - tests/demo_timeline.py
      - scripts/record_demo.py
      - .github/workflows/screenshots.yml
  schedule:
    - cron: "17 3 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshot-bot
  cancel-in-progress: false

jobs:
  render:
    name: render (${{ matrix.language }}, ${{ matrix.group }}/3)
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # The demo takes about two minutes, the images of the longest group, the second
    # or the third, about seven and a half; the step that renders them ends after
    # 21 minutes.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # A group that fails leaves the other groups and the other language running.
      fail-fast: false
      matrix:
        language: [en, de]
        group: [1, 2, 3]
    steps:
      # Only the hosts of the steps: the code from github.com, Home Assistant from
      # GitHub's registry (ghcr.io, pkg-containers.githubusercontent.com), Playwright
      # from Microsoft's (mcr.microsoft.com, *.data.mcr.microsoft.com), pngquant from
      # Launchpad (launchpad.net, launchpadlibrarian.net) and the Python packages of
      # the tool (pypi.org, files.pythonhosted.org). Home Assistant itself reaches
      # only the icons of its other integrations, which the images show
      # (brands.home-assistant.io).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            launchpad.net:443
            launchpadlibrarian.net:443
            pypi.org:443
            files.pythonhosted.org:443
            brands.home-assistant.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A step that hangs fails at a time limit of its own, three minutes or more
      # before that of the job, so that the steps after it keep its logs and explain
      # it: GitHub cancels a job at its limit, and then no step after it runs. With
      # exec, the signal with which GitHub stops the step reaches the script itself,
      # which prints the state of its containers before it ends
      # (docs/development.md#when-a-step-hangs).
      - name: Render the images of the group with the frozen clock
        timeout-minutes: 21
        env:
          LANGUAGES: ${{ matrix.language }}
          SCREENSHOT_GROUP: ${{ matrix.group }}/3
          IMAGES: tests/e2e/artifacts/rendered
        run: exec bash tests/e2e/screenshots.sh
      - name: List how long the sections took
        if: ${{ !cancelled() }}
        run: |
          for table in tests/e2e/artifacts/screenshots-*.md; do
            if [[ -f "$table" ]]; then
              cat "$table" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      # The seconds of the group, for the table of all groups of the language in the
      # job that puts together them (tests/e2e/group_times.py). An artifact of their own: the
      # folder of the images belongs to the container that rendered them.
      - name: Keep the seconds of the group
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: times-${{ matrix.language }}-${{ matrix.group }}
          path: tests/e2e/artifacts/screenshots-*.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the images of the group
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-${{ matrix.language }}-${{ matrix.group }}
          path: tests/e2e/artifacts/rendered/
          if-no-files-found: error
          retention-days: 1
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.language }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: tests/e2e/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

  collect:
    name: collect (${{ matrix.language }})
    needs: render
    # Also after a failed group: the other language still comes together.
    if: ${{ !cancelled() && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [en, de]
    steps:
      # The code and Pillow for the comparison; Harden-Runner itself allows the
      # storage of the artifacts. No step needs sudo or Docker.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the images of every group
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rendered-${{ matrix.language }}-*
          path: tests/e2e/artifacts
      - name: Install Pillow for the comparison
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes -r tests/e2e/requirements-browser.txt
      - name: Put the groups together and compare them with the committed images
        timeout-minutes: 5
        env:
          LANGUAGES: ${{ matrix.language }}
          PYTHON: ${{ runner.temp }}/venv/bin/python
          RESTORE: "1"
        run: bash tests/e2e/collect.sh
      - name: List the images that changed
        run: cat tests/e2e/artifacts/visual/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Take the seconds of every group
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: times-${{ matrix.language }}-*
          path: tests/e2e/artifacts
      # Every group with its seconds; one that took more than one and a half times as
      # long as the shortest is marked, so that GROUPS of screenshots.py gets a new
      # balance (docs/development.md#groups-side-by-side).
      - name: List how long the groups took
        if: ${{ !cancelled() }}
        # Only informational: never keeps the images or the report from being kept.
        continue-on-error: true
        env:
          LANGUAGE: ${{ matrix.language }}
        run: python3 tests/e2e/group_times.py "$LANGUAGE" tests/e2e/artifacts >> "$GITHUB_STEP_SUMMARY"
      # Only the rendered images: the diagrams of docs/images come from
      # render_diagrams.sh, and main may have newer ones by now.
      - name: Keep the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.language }}
          path: tests/e2e/artifacts/collected/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 3
      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.language }}
          path: tests/e2e/artifacts/visual/report.json
          if-no-files-found: error
          retention-days: 3
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The games of the live demo, played by the integration in the Home Assistant of
  # the tests with its locked packages; Python comes from the runner's tool cache.
  timeline:
    name: timeline
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install the packages of the tests
        run: pip install --quiet --disable-pip-version-check --require-hashes -r requirements-test.txt
      - name: Record the games of the live demo
        run: python scripts/record_demo.py "$RUNNER_TEMP/timeline/timeline.json"
      - name: Keep the recording
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timeline
          path: ${{ runner.temp }}/timeline/
          if-no-files-found: error
          retention-days: 1
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  pull-request:
    name: pull request
    needs: [collect, timeline]
    # Also when one language failed: the other one still reaches its pull request.
    if: ${{ !cancelled() && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      # The job holds the key of the release app, so it reaches GitHub alone: main
      # from github.com, the branch and the pull request through its API; Harden-Runner
      # itself allows the storage of the artifacts. Without sudo and Docker no step can
      # lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
      # The images go onto main as it is now, not as it was when the rendering began:
      # main may have moved on in the meantime, and it only takes pull requests that
      # are up to date with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Take the rendered images and their reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Not the images of the groups or the screenshots of a failed run.
          pattern: "{images-*,report-*,timeline}"
          path: ${{ runner.temp }}/rendered
      - name: Put the rendered images in place
        id: images
        run: |
          set -euo pipefail
          missing=""
          for language in en de; do
            report="$RUNNER_TEMP/rendered/report-$language/report.json"
            if [[ -d "$RUNNER_TEMP/rendered/images-$language" && -f "$report" ]]; then
              # The rendered images over those of main as it is now, which may have
              # newer diagrams; an image that the tool no longer renders goes.
              cp "$RUNNER_TEMP/rendered/images-$language/"* "docs/images/$language/"
              jq -r '.images[] | select(.status == "removed") | .path' "$report" |
                while read -r path; do
                  if [[ "$path" =~ ^$language/[a-z0-9][a-z0-9-]*\.(png|webp)$ ]]; then
                    rm -f "docs/images/$path"
                  fi
                done
            else
              missing="${missing:+$missing }$language"
            fi
          done
          # The recording of the live demo, when the timeline job made one.
          if [[ -f "$RUNNER_TEMP/rendered/timeline/timeline.json" ]]; then
            cp "$RUNNER_TEMP/rendered/timeline/timeline.json" docs/demo/timeline.json
          else
            echo "::warning::The games of the live demo were not recorded; it keeps the recording it has."
          fi
          if [[ "$missing" == "en de" ]]; then
            echo "::error::No language rendered, so the images and their pull request stay as they are; the render jobs show why."
            exit 1
          fi
          if [[ -n "$missing" ]]; then
            echo "::warning::The images in $missing did not render; the pull request keeps what it had for them."
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          git status --short -- docs/images docs/demo/timeline.json
      - name: Create a token of the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request of the images need.
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request of the images
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SHA: ${{ github.sha }}
          MISSING: ${{ steps.images.outputs.missing }}
        run: |
          set -euo pipefail
          # The images were rendered from $SHA; the branch starts from main as checked out.
          base="$(git rev-parse HEAD)"
          branch="bot/screenshots"
          title="docs: update the screenshots of the cards"
          # Only the app's own pull request from the branch of this repository: a fork
          # may open one from a branch of the same name.
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
            --json number,isCrossRepository,author |
            jq -r --arg login "app/$APP_SLUG" \
              '[.[] | select(.isCrossRepository == false and .author.login == $login)][0].number // empty')"
          if [[ -n "$MISSING" && -n "$number" ]]; then
            # A language that did not render this time keeps the images that the open
            # pull request has for it, from the branch of this repository: only the
            # rendered images, not the diagrams, which main may have anew by now.
            git fetch --quiet --no-tags --depth=1 origin "refs/heads/$branch"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files" --jq '.[].filename' |
              while read -r path; do
                for language in $MISSING; do
                  if [[ ! "$path" =~ ^docs/images/$language/([a-z0-9][a-z0-9-]*)\.(png|webp)$ ]]; then
                    continue
                  fi
                  name="${BASH_REMATCH[1]}"
                  if [[ "$name" =~ ^(.+)-(light|dark)$ && -f "docs/diagrams/${BASH_REMATCH[1]}.$language.mmd" ]]; then
                    continue
                  fi
                  if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                    git checkout FETCH_HEAD -- "$path"
                  else
                    git rm --quiet --ignore-unmatch -- "$path"
                  fi
                done
              done
          fi
          git add --all docs/images docs/demo/timeline.json
          if git diff --cached --quiet; then
            echo "Every image looks as committed."
            if [[ -n "$MISSING" ]]; then
              echo "The images in $MISSING did not render, so the pull request of the images stays as it is."
              exit 0
            fi
            if [[ -n "$number" ]]; then
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "The images on main look as rendered from $SHA; nothing is left to update."
            fi
            exit 0
          fi

          # The commits go through GitHub's API as the release app: GitHub signs them,
          # as main requires, and the pull request of the app starts the checks. The
          # sign-off names the app's account, which is the author of the commits.
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          export SIGN_OFF="Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          # The images go onto a branch of their own first, from main as it is now, and
          # the branch of the pull request follows in one move: pointed at a commit main
          # already has, even for a moment, it would close its pull request. A branch
          # whose workflows differ from those of main counts as a change of workflows,
          # which GitHub refuses to the app: it has no permission for them.
          staging="$branch-$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$staging" -f sha="$base" >/dev/null
          trap 'gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$staging" >/dev/null || true' EXIT
          python3 - "$staging" "$base" "$RUNNER_TEMP" <<'PYTHON'
          import base64
          import json
          import os
          import subprocess
          import sys

          branch, head, folder = sys.argv[1:]
          paths = subprocess.run(
              ["git", "diff", "--cached", "--name-only", "--no-renames", "-z", "HEAD"],
              capture_output=True, check=True,
          ).stdout.decode().split("\0")
          paths = [path for path in paths if path]
          # A request of the API takes a few megabytes; larger sets of images go in parts.
          parts, part, size = [], [], 0
          for path in paths:
              length = os.path.getsize(path) if os.path.exists(path) else 0
              if part and size + length > 8_000_000:
                  parts.append(part)
                  part, size = [], 0
              part.append(path)
              size += length
          parts.append(part)
          for index, part in enumerate(parts, 1):
              additions = [
                  {"path": path, "contents": base64.b64encode(open(path, "rb").read()).decode()}
                  for path in part if os.path.exists(path)
              ]
              deletions = [{"path": path} for path in part if not os.path.exists(path)]
              headline = "docs: update the screenshots of the cards"
              if len(parts) > 1:
                  headline += f" ({index} of {len(parts)})"
              body = (
                  "Rendered from the demo with its frozen clock, in groups "
                  "(tests/e2e/screenshots.sh, tests/e2e/collect.sh).\n\n"
                  + os.environ["SIGN_OFF"]
              )
              request = {
                  "query": "mutation($input: CreateCommitOnBranchInput!) "
                           "{ createCommitOnBranch(input: $input) { commit { oid } } }",
                  "variables": {"input": {
                      "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": branch},
                      "expectedHeadOid": head,
                      "message": {"headline": headline, "body": body},
                      "fileChanges": {"additions": additions, "deletions": deletions},
                  }},
              }
              with open(f"{folder}/commit.json", "w") as file:
                  json.dump(request, file)
              head = subprocess.run(
                  ["gh", "api", "graphql", "--input", f"{folder}/commit.json",
                   "--jq", ".data.createCommitOnBranch.commit.oid"],
                  capture_output=True, check=True, text=True,
              ).stdout.strip()
              print(f"Committed {len(part)} image(s): {head}")
          with open(f"{folder}/head", "w") as file:
              file.write(head)

          # The description: every image whose pixels changed, with how much.
          rows = []
          missing = os.environ["MISSING"].split()
          for language in ("en", "de"):
              if language in missing:
                  continue
              with open(f"{folder}/rendered/report-{language}/report.json") as file:
                  for entry in json.load(file)["images"]:
                      share = entry["share"]
                      shown = "100 %" if share >= 1 else "< 0.01 %" if share < 0.0001 else f"{share * 100:.2f} %"
                      rows.append(f"| `docs/images/{entry['path']}` | {entry['status']} | {shown} |")
          kept = ""
          if "docs/demo/timeline.json" in paths:
              kept += (
                  "\n\nThe games of the live demo were recorded anew, too "
                  "(`docs/demo/timeline.json`, scripts/record_demo.py)."
              )
          if missing:
              names = " and ".join({"en": "English", "de": "German"}[code] for code in missing)
              kept += f"\n\nThe {names} images did not render in this run; the pull request keeps what it had for them."
          # A run that only recorded the live demo anew has no table of images.
          if rows:
              changes = (
                  "These look different:\n\n"
                  "| Image | Change | Pixels changed |\n| --- | --- | ---: |\n"
                  + "\n".join(rows)
              )
          else:
              changes = "No image changed."
          with open(f"{folder}/body.md", "w") as file:
              file.write(
                  "The screenshot bot rendered the images of the documentation anew from the demo, "
                  f"with its frozen clock, on {os.environ['SHA']}. "
                  + changes
                  + kept
                  + "\n\nThe workflow run keeps the images before and after with their differences "
                  f"for three days: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
              )
          PYTHON
          head="$(cat "$RUNNER_TEMP/head")"

          # Moving the branch of an open pull request onto the new images meets the
          # workflows again when main changed them since the branch began; then the
          # branch starts anew, which closes that pull request.
          create=1
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="$head" -F force=true >/dev/null; then
              create=""
            else
              echo "The branch can't move onto the new images; it starts anew."
              if [[ -n "$number" ]]; then
                gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body \
                  "main changed workflows since this branch began, so the bot can't move it onto main; a new pull request takes over the images rendered from $SHA."
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              number=""
            fi
          fi
          if [[ -n "$create" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$head" >/dev/null
          fi

          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash
      # Without sudo and Docker, Harden-Runner removes Docker with apt-get while the
      # job runs. A job that ends first hangs in "Cleaning up orphan processes" until
      # its timeout, so it waits for apt-get, also after a failure
      # (docs/development.md#network-of-the-jobs).
      - name: Wait until Harden-Runner has removed Docker
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
