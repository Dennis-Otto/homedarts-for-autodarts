name: Board compatibility report
description: Tell us whether the integration works with your board setup; working setups help too.
labels:
  - compatibility
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Reports of working setups help other players choose, and reports of problems help support more boards.

        Within a few minutes, an AI issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/SUPPORT.md#what-happens-with-your-issue)).
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything works
        - Works with limitations
        - Does not work
    validations:
      required: true
  - type: dropdown
    id: board_manager
    attributes:
      label: Autodarts software on the board PC
      options:
        - Autodarts 2 without a screen (Board Manager 2, headless)
        - Autodarts Desktop
        - Winmau Autodarts device (Autodarts X, Lens, Vantage)
        - Board Manager 1 (classic app)
        - I don't know
    validations:
      required: true
  - type: input
    id: board_manager_version
    attributes:
      label: Version of the Autodarts software
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: board_pc
    attributes:
      label: Board PC and operating system
      placeholder: "Raspberry Pi 5, Raspberry Pi OS / mini PC, Ubuntu 24.04"
  - type: input
    id: cameras
    attributes:
      label: Cameras
      placeholder: "3 × Autodarts camera kit"
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "2.3.1"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.3"
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How was the board added?
      options:
        - Discovered automatically
        - Search for boards
        - Entered address
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What works and what doesn't?
      description: For example realtime events, controls, calibration, camera health, practice games or the cards.
  - type: textarea
    id: recording
    attributes:
      label: What the board answers (optional)
      description: >-
        From a clone of the repository, `python scripts/capture_board.py <address of the board PC>`
        records what your Board Manager answers while you throw a few darts, with placeholders in place
        of the board's ID, its keys and the addresses of your network. Attach the folder it writes as a
        zip file here: it becomes a test, so that every release keeps working with your board.
