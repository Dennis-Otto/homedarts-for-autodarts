name: Bug report
description: Something in the integration, a card or a blueprint does not work as documented.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the [troubleshooting guide](https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/troubleshooting.md) first.

        Within a few minutes, an AI issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **Never post** access tokens, board API keys, public IP addresses or other personal data. Diagnostics downloaded from Home Assistant are already redacted.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the detection
        2. Throw three darts
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup, discovery or reconfiguration
        - Connection to the board
        - Dartboard without Autodarts (every dart entered by hand)
        - Granboard over Bluetooth
        - Entities or board events
        - Training sessions and statistics
        - X01 practice game or match
        - Teams, start scores or bull-off
        - Cricket games (Cricket, Cut-Throat, Tactics)
        - Party games (Shanghai, Halve-It, Killer, Golf, Baseball, Count-Up, Bermuda, Round the World, Gotcha)
        - Training games (Around the Clock, doubles, checkout, Bob's 27, 121 checkout, Catch 40, JDC Challenge, singles)
        - Match summary or tournaments
        - Bot, corrections, keypad or undo
        - Player profiles, personal bests or doubles analysis
        - Achievements, trends, dart positions or leaderboard card
        - Weekly report, training calendar or export
        - Live card
        - Training card
        - Board status card
        - Scoreboard card, new game screen, idle mode or caller
        - Players or doubles card
        - Automatic dashboard
        - Actions (homedarts.*)
        - Blueprints
        - Highlight gallery
        - Online matches (online bridge)
        - Translations
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "2.3.1"
    validations:
      required: true
  - type: input
    id: last_working_version
    attributes:
      label: Last version that worked
      description: Leave empty if it never worked or you don't know.
      placeholder: "2.2.3"
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.3"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Home Assistant installation type
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true
  - type: dropdown
    id: board_manager
    attributes:
      label: Board and its software
      description: For an Autodarts board, the Autodarts software on its board PC.
      options:
        - Board Manager 2 (headless)
        - Autodarts Desktop
        - Board Manager 1 (classic app)
        - Dartboard without Autodarts (every dart entered by hand)
        - Granboard over Bluetooth
        - I don't know
    validations:
      required: true
  - type: input
    id: board_manager_version
    attributes:
      label: Board Manager or Autodarts Desktop version
      description: Shown on the device page in Home Assistant.
      placeholder: "2.0.0"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → HomeDarts for Autodarts → ⋮ → Download diagnostics. Drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Relevant lines with debug logging enabled for the integration.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed tokens, keys and personal data from everything I posted.
          required: true
