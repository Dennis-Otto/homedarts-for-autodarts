# The answers of OpenSSF Best Practices (https://www.bestpractices.dev) that only this
# repository can give, on top of .bestpractices.json, which the blueprint keeps current
# with what it guarantees for every repository of its kind. Never change that file: an
# answer of this repository alone goes here, and no update of the blueprint touches it.
#
# One table for each criterion, named as in .bestpractices.json, such as [test] or
# [osps_br_07_01]. For a criterion that .bestpractices.json answers, a table gives only
# its justification, which replaces the file's own: the status stays the blueprint's
# Met. For any other criterion, such as security_review, a table gives status (Met,
# Unmet or N/A) and justification. A link names a file or a heading of this repository,
# or uses https. Only what is true of this repository belongs here, such as its own
# end-to-end tests:
#
# [test]
# justification = "pytest, and the end-to-end tests in Docker: https://github.com/OWNER/REPOSITORY/blob/main/tests/e2e/run.sh"
#
# [security_review]
# status = "Met"
# justification = "..."
#
# The weekly run of the workflow Links compares the public entry with both files and
# keeps an issue with the links of the edit pages that take the answers in: change an
# answer here, not on the site, as these links force it back. "Save (and continue)" on
# bestpractices.dev reads .bestpractices.json only. The step "Answers for
# bestpractices.dev" of scripts/check.sh checks this file with
# python3 .github/blueprint.py best-practices --verify.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/bots.md#the-entry-on-bestpracticesdev
#
# The answers below add what only this integration has to the blueprint's answers:
# the end-to-end tests in Docker (tests/e2e/, e2e.yml), the tests of the dashboard
# cards with npm and ESLint for their JavaScript (scripts/check-project.sh), and the
# release package that HACS installs (docs/releases.md). Each one keeps what the
# blueprint's answer says, since it replaces that answer.

[test]
justification = "An automated test suite, which scripts/check.sh runs with pytest and its coverage of every line and branch, on a computer and in the CI, together with the Node tests of the dashboard cards and the translation bot in tests/frontend/ (npm test), which cover every line, branch and function; the end-to-end tests in Docker run the integration in a real Home Assistant against a simulated Board Manager (tests/e2e/run.sh) and check the cards in Chromium, Firefox and WebKit (tests/e2e/browser.sh): https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/development.md#tests"

[test_invocation]
justification = "bash scripts/check.sh runs the tests with every other check, the same on a computer and in the CI: pytest and, once npm ci has installed the tools of the cards, their tests with npm test; with Docker, BOARD_MANAGER=2 bash tests/e2e/run.sh runs the end-to-end test and bash tests/e2e/browser.sh the browser test of the cards, as the section Tests of the development guide shows: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/CONTRIBUTING.md#checks https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/development.md#tests"

[test_continuous_integration]
justification = "The CI runs scripts/check.sh with the tests on every pull request and after every change of main, as the required check check (home-assistant), with pytest and the tests of the cards (npm test); the workflow Docker E2E runs the end-to-end tests in Home Assistant and the browser tests of the cards after every change of main, every night and on every pull request that changes what they run or mount, and reports them in the required check e2e: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/scripts/check.sh https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/.github/workflows/e2e.yml"

[automated_integration_testing]
justification = "The CI runs scripts/check.sh with the whole test suite on every pull request and after every change of main, and reports its success or failure as a required check; the required check home-assistant validates the integration with HACS and hassfest and imports every module of it in the image of the oldest Home Assistant that hacs.json names; the required check e2e of the workflow Docker E2E runs the integration in a real Home Assistant in Docker against a simulated Board Manager 1, 2 and 2.1 and on the oldest supported Home Assistant, with faults injected into the connection to the board, and checks the dashboard cards in Chromium, Firefox and WebKit against the current and the oldest supported Home Assistant, after every change of main, every night and on every pull request that changes what they test; every night a job runs them against the beta of Home Assistant as well: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/.github/workflows/ci.yml https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/.github/workflows/e2e.yml"

[coding_standards]
justification = "CONTRIBUTING.md names the coding standards that contributions follow: PEP 8 in the format of Ruff and type hints that mypy checks for Python and the rules of hassfest and HACS for the integration; ShellCheck for the shell scripts, actionlint and zizmor for the workflows, markdownlint for Markdown and .editorconfig for every text file; the development guide adds the recommended rules of ESLint in eslint.config.mjs for the JavaScript of the dashboard cards and their tests: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/CONTRIBUTING.md#coding-standards https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/development.md#requirements-for-changes"

[coding_standards_enforced]
justification = "scripts/check.sh runs ruff format --check, ruff check, mypy and ShellCheck, and as its last step scripts/check-project.sh, which lints the JavaScript of the cards, their tests and the scripts with ESLint and the rules of eslint.config.mjs and in the CI fails when Node.js or the packages of npm ci are missing; the Lint workflow runs actionlint, markdownlint, REUSE and the DCO check, and the required check home-assistant runs hassfest and HACS, on every pull request, which merges only when they pass; a new alert of zizmor's audit of the workflows stops the merge as well, and CONTRIBUTING.md asks that an exception to a rule be rare and marked at its place in the code, with its reason in a comment: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/scripts/check.sh https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/scripts/check-project.sh"

[installation_development_quick]
justification = "CONTRIBUTING.md shows how to set up everything to make and test changes: a virtual environment with pip install --require-hashes -r requirements-test.txt, then bash scripts/check.sh runs the checks, the same on a computer and in the CI, and git config core.hooksPath .githooks runs them before every push; npm ci installs the tools of the dashboard cards from package-lock.json, and the section Tests of the development guide shows these commands together with the end-to-end tests in Docker; the tools of the website go into a virtual environment .venv-docs with pip install --require-hashes -r .github/docs-requirements.txt, and with them bash scripts/check.sh builds the website as well, as its section Website says; the dev container in .devcontainer/ has every tool set up, Node.js 24 and Docker too, and runs npm ci itself, for VS Code and GitHub Codespaces: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/CONTRIBUTING.md#checks https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/development.md#tests"

[external_dependencies]
justification = "The integration declares no Python requirement of its own (requirements is empty in its manifest.json) and uses the libraries that come with Home Assistant; requirements-test.in lists the direct dependencies of the tests, and requirements-test.txt pins each with its hashes; package.json lists the tools of the dashboard cards, which package-lock.json pins with their hashes: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/custom_components/homedarts/manifest.json https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/requirements-test.in https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/package.json"

[release_notes]
justification = "Every release has its notes in CHANGELOG.md and in its GitHub release, written in the words of a user from the entries that its pull requests bring, below the heading of their kind of change; HACS shows the notes of the GitHub release in the update dialog of Home Assistant, and docs/releases.md says how they come about: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/CHANGELOG.md https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/releases.md#the-release-pull-request"

[signed_releases]
justification = "Every release is immutable, GitHub signs an attestation that ties its tag to its commit and to every file, and the release workflow signs the build provenance of every file with Sigstore, without a long-lived key, and the tag with gitsign; the commit of the release is signed as well, and the Release verification checks both after every release; the job that publishes the website signs the provenance of what it publishes; SECURITY.md shows how to verify them, and docs/releases.md lists the signed files, among them homedarts.zip, which HACS installs, and shows how to verify a download with gh attestation verify, also offline with the bundle provenance.sigstore.json: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/SECURITY.md#verify-a-release https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/docs/releases.md#signed-release-packages"

[warnings]
justification = "scripts/check.sh runs ShellCheck, Ruff, mypy and, as its last step, scripts/check-project.sh, which checks every module of the dashboard cards with node --check and lints the JavaScript with the recommended rules of ESLint in eslint.config.mjs; the Lint workflow runs actionlint, markdownlint and REUSE, and zizmor audits the workflows: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/scripts/check.sh https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/eslint.config.mjs"

[warnings_fixed]
justification = "A warning of ShellCheck, Ruff, mypy, ESLint, actionlint, markdownlint or REUSE fails a required check, scripts/check.sh in the CI or the Lint workflow, so a pull request merges only once it is fixed; every rule of ESLint that eslint.config.mjs turns on is an error, on which scripts/check-project.sh fails; the findings of zizmor go to code scanning, where the Findings workflow fails until each is fixed or accepted with its reason: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/CONTRIBUTING.md#coding-standards https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/eslint.config.mjs"
