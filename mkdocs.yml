# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
# The name of the website, which ends the title of every page, and the German one
# below. It is the name of the integration, which names Autodarts, so that the
# website is found with it, and it is not the website of Autodarts itself.
site_name: "HomeDarts for Autodarts"
site_description: "HomeDarts for Autodarts, the Home Assistant integration for Autodarts boards and any dartboard: local realtime board control, X01, Cricket, party and training games, tournaments and a bot, player statistics with heatmaps, seven dashboard cards and sixteen blueprints, games started by voice. No cloud account needed."
site_url: https://dennis-otto.github.io/homedarts-for-autodarts/
repo_url: https://github.com/Dennis-Otto/homedarts-for-autodarts
repo_name: Dennis-Otto/homedarts-for-autodarts
# The footer of every page; the German one is with the languages below. It says
# that the website is not one of Autodarts, whose boards it is about.
copyright: "© 2026 Trkal and HACSAutodarts contributors; 2026 Dennis Otto<br>HomeDarts for Autodarts is an unofficial community integration, not affiliated with Autodarts."

# The brand of the website: the icon of the integration in the header and as favicon
# (scripts/render_brand.py renders it from the icon), and the navy and teal of the
# icon, the social preview and the cards in place of Material's indigo, with
# docs/stylesheets/brand.css. The list of the palette replaces the one of
# .github/mkdocs-blueprint.yml, so it repeats its switch between the scheme of the
# system, light and dark.
theme:
  logo: branding/icon.svg
  favicon: branding/favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the scheme of the system

# The website starts with index.md and index.de.md. README.md and README.de.md are
# the overviews of the folder on GitHub, and docs/de/ only keeps the old addresses
# of the German pages that released versions link to. The template of a decision is
# for the pull request that copies it, not for readers of the website.
exclude_docs: |
  /README.md
  /README.de.md
  /de/
  /decisions/0000-template.md

plugins:
  search:
    lang: [en, de]
  # The preview cards of shared links in the navy of the brand, with the icon of the
  # header, as the social preview of the repository.
  social:
    cards_layout_options:
      background_color: "#0a1624"
      color: "#e6edf3"
  # The changelog page is a single include of CHANGELOG.md: the date of its last
  # commit would never change with a release.
  git-revision-date-localized:
    exclude:
      - changelog.md
  # English and German. The German pages sit next to the English ones, named like
  # them with .de, such as games.de.md next to games.md, and make the German website
  # in de/, with German menus, search and dates, and a switch between the languages
  # in the header that keeps the page. A page without German version is shown in
  # English there. https://ultrabug.github.io/mkdocs-static-i18n/
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_name: "HomeDarts for Autodarts"
        copyright: "© 2026 Trkal und Mitwirkende von HACSAutodarts; 2026 Dennis Otto<br>HomeDarts for Autodarts ist eine inoffizielle Integration der Community, nicht mit Autodarts verbunden."
        site_description: "HomeDarts for Autodarts, die Home-Assistant-Integration für Autodarts-Boards und jede Dartscheibe: lokale Echtzeit-Steuerung des Boards, X01, Cricket, Party- und Trainingsspiele, Turniere und ein Bot, Spielerstatistik mit Trefferbildern, sieben Dashboard-Karten und sechzehn Blueprints, Spiele per Sprache starten. Kein Cloud-Konto nötig."
        nav_translations:
          Home: Start
          Get started: Erste Schritte
          Guides: Anleitungen
          Reference: Referenz
          Project: Projekt
          Changelog: Änderungen
          Decisions: Entscheidungen

# Links in the HTML of a page, links to the start pages of GitHub and links to the
# other language lead to the pages of the website, as the links of the Markdown do.
hooks:
  - scripts/mkdocs_hooks.py
  # The hooks of the blueprint, such as the sitemap of every language.
  - .github/mkdocs_blueprint.py

# The styles of the website on top of those of the theme: the colours of the brand,
# and others such as the picture cards of the home page and the wrapped lines of the
# texts to copy in the creator kit.
extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css

# The menu, a tab in the header for each section. The German website has the same
# one, with the German pages and the titles of nav_translations above.
nav:
  - Home: index.md
  - Get started:
      - getting-started.md
      - installation.md
      - without-autodarts.md
      - granboard.md
      - faq.md
      - coming-from.md
      - new-name.md
  - Guides:
      - games.md
      - scoreboard.md
      - statistics.md
      - automations.md
      - online-matches.md
  - Reference:
      - cards.md
      - entities.md
      - how-it-works.md
      - troubleshooting.md
      - security.md
      - glossary.md
  - Project:
      # CHANGELOG.md, which changelog.md includes with its links for the website.
      - Changelog: changelog.md
      - roadmap.md
      - development.md
      - releases.md
      - creator-kit.md
      - Decisions: decisions/README.md
