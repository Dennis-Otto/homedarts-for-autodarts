[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# A hanging test fails instead of blocking the run, locally as in CI.
timeout = 30
# Warnings of the integration's own code are errors.
filterwarnings = ['error:::custom_components\.homedarts']
markers = [
    "expected_errors: the test logs errors of the integration on purpose",
    "installs_blueprints: the integration copies its blueprints into the configuration folder, which the test points to a folder of its own",
    "mutation_unsafe: fails in mutmut's copy of the repository, which has no Git and holds every mutant in the code; skipped under mutmut",
]

# The weekly mutation tests (.github/workflows/mutation.yml) with mutmut. They change
# the modules of the game rules whose roughly 2,800 mutants one run reaches on the
# four cores of a runner (1 h 51 min); practice.py, drills.py and tournament.py, with
# about 5,900 more, join once the run is split into parts. See
# docs/development.md#mutation-tests.
[tool.mutmut]
source_paths = ["custom_components"]
only_mutate = [
    "custom_components/homedarts/board.py",
    "custom_components/homedarts/bot.py",
    "custom_components/homedarts/checkout.py",
    "custom_components/homedarts/cricket.py",
    "custom_components/homedarts/doubles.py",
    "custom_components/homedarts/party.py",
    "custom_components/homedarts/positions.py",
    "custom_components/homedarts/scoring.py",
]
# mutmut runs the tests in its copy of the repository, mutants/, which gets the
# integration and every other file and folder of the repository that a test may read.
# It skips a path that doesn't exist, so the list also names the files and folders
# that coming blueprint updates add (.bestpractices.json, AGENTS.md, CITATION.cff,
# CLAUDE.md, changelog.d and the Home Assistant configuration in config).
also_copy = [
    ".bestpractices.json",
    ".copier-answers.yml",
    ".devcontainer",
    ".editorconfig",
    ".gitattributes",
    ".githooks",
    ".github",
    ".gitignore",
    ".lycheeignore",
    ".markdownlint-cli2.jsonc",
    ".markdownlint.jsonc",
    ".pre-commit-config.yaml",
    ".python-version",
    ".release-please-manifest.json",
    ".vale.ini",
    "AGENTS.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "LICENSE",
    "LICENSES",
    "README.md",
    "REUSE.toml",
    "SECURITY.md",
    "SUPPORT.md",
    "blueprints",
    "changelog.d",
    "config",
    "docs",
    "eslint.config.mjs",
    "hacs.json",
    "lychee.toml",
    "mkdocs.yml",
    "osv-scanner.toml",
    "package-lock.json",
    "package.json",
    "pyproject.toml",
    "release-please-config.json",
    "requirements-test.in",
    "requirements-test.txt",
    "scripts",
    "tests",
    "version.txt",
]

[tool.coverage.run]
branch = true
source = ["custom_components/homedarts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
# The settings tool of the blueprint, which the blueprint keeps current.
extend-exclude = [".github/blueprint.py"]
target-version = "py313"

[tool.ruff.lint]
select = [
  "ASYNC", # flake8-async: blocking calls and busy waits in async code
  "B", # flake8-bugbear: likely bugs, such as a closure over a loop variable
  "C4", # flake8-comprehensions: the shorter form of a comprehension
  "DTZ", # flake8-datetimez: a date or time without a time zone
  "E", # pycodestyle errors
  "F", # Pyflakes
  "I", # isort
  "LOG", # flake8-logging: how the logging module is called
  "PIE", # flake8-pie: statements that do nothing
  "PT", # flake8-pytest-style
  "RUF", # the rules of Ruff itself
  "SIM", # flake8-simplify
  "UP", # pyupgrade
  "W", # pycodestyle warnings
]
ignore = [
  "E501", # The formatter breaks the lines; what stays long is a string or a URL.
  "PT018", # A compound assert reads as one fact about one state in these tests.
  "RUF001", # The strings hold German text and typographic marks on purpose.
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/homedarts"]

# Home Assistant re-exports helpers such as StaticPathConfig without __all__.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
