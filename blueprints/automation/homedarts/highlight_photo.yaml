blueprint:
  name: "HomeDarts: highlight photo"
  description: >-
    Takes a photo of the board after a big visit or a checkout of the practice
    game, from one of the board cameras while the darts are still in the board.
    A visit counts when its third dart lands. When the same dart also wins a
    leg, you get one photo with the checkout message. The bot's darts are not in
    the board, so its visits and legs get no photo.


    The photo is saved to the highlight gallery, which the media browser shows
    under Autodarts, and your actions can send it on: they can use `photo_url`
    (the address of the saved photo, for example `data: {image: "{{ photo_url
    or image }}"}` in a notification of the Home Assistant app), `photo` (the
    saved file), `image` (the live camera picture), `message`, `score`,
    `checkout` and `who`. `photo` and `photo_url` are empty when no photo was
    saved: the camera entity is disabled or unavailable, the camera gives no
    picture, or Home Assistant may not write to the folder. Turn on the camera
    entity first; camera entities are disabled by default.


    With a clip camera, a camera with a video stream that films the board, the
    moment is also recorded as a clip, from a few seconds before the dart to a
    few seconds after it, saved beside the photo under its name with `.mp4`, and
    the gallery plays it. Your actions get its file and address as `clip` and
    `clip_url` at once, without waiting for the recording; the file is
    written when the recording ends.


    The action `homedarts.save_highlight` of HomeDarts saves the photo, and the
    clip of a clip camera.


    [Settings and examples in the guide](https://dennis-otto.github.io/homedarts-for-autodarts/automations.html#highlight-photo)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/blueprints/automation/homedarts/highlight_photo.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board:
      name: Board
      icon: mdi:bullseye-arrow
      input:
        board_events:
          name: Board events
          description: The "Events" entity of your Autodarts board.
          selector:
            entity:
              filter:
                - integration: homedarts
                  domain: event
        camera:
          name: Camera
          description: The board camera that takes the photo.
          selector:
            entity:
              filter:
                - integration: homedarts
                  domain: camera
    moments:
      name: Moments
      icon: mdi:star-shooting
      input:
        minimum_score:
          name: Visits from
          description: A visit with at least this score gets a photo.
          default: 180
          selector:
            number:
              min: 1
              max: 180
              step: 1
              mode: box
              unit_of_measurement: points
        checkouts:
          name: Checkouts
          description: Also a photo when a practice leg is won with a checkout.
          default: true
          selector:
            boolean: {}
    gallery:
      name: Gallery
      icon: mdi:image-multiple
      input:
        save_photo:
          name: Save to the gallery
          description: >-
            Saves every photo as a file in the folder below, named by the time,
            the player and the score, for example
            2026-09-26_21-05-33_Alex_180.jpg.
          default: true
          selector:
            boolean: {}
        gallery_folder:
          name: Folder
          description: >-
            Empty for the highlight gallery of the media browser: the folder
            homedarts/highlights of your media folder, which is
            /media/homedarts/highlights on Home Assistant OS and in a container.
            Another folder must be one Home Assistant may write to, for example
            /media/darts on Home Assistant OS or a folder of
            allowlist_external_dirs; outside the media folder and www, the photos
            get no `photo_url`. Files in www are available at /local/ without a
            login.
          default: ""
          selector:
            text: {}
        kept_highlights:
          name: Highlights kept
          description: >-
            How many of the newest photos the highlight gallery keeps, each with
            its clip: after a photo is saved, older ones are deleted. 0 keeps
            every photo. A folder of your own above is never pruned.
          default: 1000
          selector:
            number:
              min: 0
              max: 100000
              mode: box
    photo:
      name: Photo
      icon: mdi:cellphone-message
      input:
        photo_actions:
          name: Actions
          description: >-
            For example a notification with `image: "{{ photo_url or image }}"`
            and `message: "{{ message }}"`. Optional when the photo goes to the
            gallery.
          default: []
          selector:
            action: {}
        score_message:
          name: Message for a visit
          description: The `message` of a visit photo, with `score`.
          default: "{{ score }}!"
          selector:
            text: {}
        checkout_message:
          name: Message for a checkout
          description: The `message` of a checkout photo, with `checkout` and `who`.
          default: "Checkout {{ checkout }}{{ ' by ' ~ who if who }}!"
          selector:
            text: {}
    clip:
      name: Clip
      icon: mdi:video-outline
      collapsed: true
      input:
        clip_camera:
          name: Clip camera
          description: >-
            Optional. A camera with a video stream that films the board, such as
            a camera of the room or the one of your stream, records the moment
            as a clip beside the photo; it needs Save to the gallery. The board
            cameras of Autodarts give pictures, not a video stream. For the
            seconds before the dart, turn on Preload camera stream in the
            settings of the camera entity.
          default: ""
          selector:
            entity:
              filter:
                - domain: camera
                  supported_features:
                    - camera.CameraEntityFeature.STREAM
        clip_lookback:
          name: Seconds before
          description: >-
            How much of the clip comes before the dart, while the stream of the
            camera runs ahead, as with Preload camera stream on.
          default: 5
          selector:
            number:
              min: 0
              max: 10
              step: 1
              mode: box
              unit_of_measurement: s
        clip_duration:
          name: Seconds after
          description: How much of the clip follows the moment of the photo.
          default: 8
          selector:
            number:
              min: 2
              max: 30
              step: 1
              mode: box
              unit_of_measurement: s

# A leg won by the third dart follows its visit within milliseconds: the short
# pause lets the checkout replace the visit, so the leg gets one photo.
mode: restart
max_exceeded: silent

triggers:
  - trigger: event.received
    id: visit
    target:
      entity_id: !input board_events
    options:
      event_type:
        - visit_thrown
  - trigger: event.received
    id: checkout
    enabled: !input checkouts
    target:
      entity_id: !input board_events
    options:
      event_type:
        - leg_won

variables:
  minimum_score: !input minimum_score
  camera_entity: !input camera
  image: "/api/camera_proxy/{{ camera_entity }}"
  score: "{{ trigger.to_state.attributes.get('score') | int(0) if trigger.id == 'visit' else 0 }}"
  checkout: >-
    {{ trigger.to_state.attributes.get('checkout') | int(0) if trigger.id == 'checkout' else 0 }}
  # The player at the board: the winner of a leg, or who threw the visit.
  # Template characters leave the name: some fields, such as the message of a
  # notification, are rendered once more.
  who: >-
    {{ (trigger.to_state.attributes.get('name') or '')
       | regex_replace('[{}%#\x00-\x1f]+', '') | trim }}
  save_photo: !input save_photo
  gallery_folder: !input gallery_folder
  kept_highlights: !input kept_highlights
  clip_camera: !input clip_camera
  clip_lookback: !input clip_lookback
  clip_duration: !input clip_duration
  score_text: !input score_message
  checkout_text: !input checkout_message
  message: "{{ checkout_text if trigger.id == 'checkout' else score_text }}"

conditions:
  - alias: The visit reaches the score, or the leg has a checkout to show
    condition: template
    value_template: >-
      {{ score >= minimum_score if trigger.id == 'visit' else checkout > 0 }}
  # The darts of the practice game's bot are not in the board to take a picture of.
  - alias: Not a visit or a leg of the bot
    condition: template
    value_template: "{{ 'bot' not in trigger.to_state.attributes }}"

actions:
  - delay:
      milliseconds: 500
  - variables:
      highlight: {}
  - alias: Save the photo to the gallery
    if: "{{ save_photo }}"
    then:
      # The clip records in the background, from the seconds before the dart
      # that the running stream keeps: the actions do not wait for it, and the
      # next highlight does not cut it short. A camera without a stream, or one
      # that records already, leaves the photo without a clip. The clip fields
      # go only with a clip camera, so that without one an integration older
      # than the clips still saves the photo; the number of highlights kept goes
      # only when it is not the action's own 1000, for the same reason.
      - variables:
          saving:
            camera: "{{ camera_entity }}"
            folder: "{{ gallery_folder }}"
            player: "{{ who }}"
            label: "{{ 'checkout-' ~ checkout if trigger.id == 'checkout' else score }}"
          keeping: >-
            {{ {} if kept_highlights | int(1000) == 1000
               else {'keep': kept_highlights | int(1000)} }}
          clipping:
            clip_camera: "{{ clip_camera }}"
            clip_lookback: "{{ clip_lookback | int(5) }}"
            clip_duration: "{{ clip_duration | int(8) }}"
      # The action answers only for a photo it wrote, named like
      # 2026-09-26_21-05-33_Alex_180.jpg or 2026-09-26_21-07-10_Alex_checkout-121.jpg.
      # A camera that is off or gives no picture, or a folder Home Assistant may
      # not write to, must not stop the actions: they get the live picture.
      - action: homedarts.save_highlight
        continue_on_error: true
        data: >-
          {{ dict(dict(saving, **keeping), **clipping) if clip_camera
             else dict(saving, **keeping) }}
        response_variable: highlight
  # Only a saved photo has a file, and an address when it is in a media folder.
  # Its clip goes beside it, under its name with .mp4, where the gallery finds it.
  - variables:
      photo: "{{ highlight.get('photo', '') }}"
      photo_url: "{{ highlight.get('photo_url', '') }}"
      clip: "{{ highlight.get('clip', '') }}"
      clip_url: "{{ highlight.get('clip_url', '') }}"
  - sequence: !input photo_actions
