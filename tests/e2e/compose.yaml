services:
  board-mock:
    # The Home Assistant image already provides aiohttp for the Board Manager double.
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f}
    entrypoint: ["python3", "/e2e/board_mock.py"]
    environment:
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/e2e:ro
      # The recorded answers of the Board Manager, which the double answers like.
      - ../fixtures/board_manager:/fixtures/board_manager:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3180/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f}
    depends_on:
      board-mock:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    ports:
      - "127.0.0.1:${E2E_PORT:-18123}:8123"
    volumes:
      - homeassistant_config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components/homedarts:/config/custom_components/homedarts:ro
      # Keeps Home Assistant off the internet: onboarding would set up Radio Browser,
      # which looks up radio stations there (offline/radio_browser/__init__.py).
      - ./offline/radio_browser:/config/custom_components/radio_browser:ro
      # The blueprints of the repository, where the integration installs them and
      # leaves them alone, because they are the same: the scenario starts a game by
      # voice, the demo shows them on the blueprints page.
      - ../../blueprints/automation/homedarts:/config/blueprints/automation/Dennis-Otto:ro
      - ./:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8123/api/onboarding >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 100

volumes:
  homeassistant_config:
